services:
  # CodeWithAnil Backend FastAPI Web Service on Render
  - type: web
    name: codewithanil-backend
    env: python
    region: oregon
    plan: starter # Starter plan provides sufficient RAM for transformer CPU inference
    branch: main
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: API_V1_STR
        value: /api
      - key: HF_MODEL_NAME
        value: Hello-SimpleAI/chatgpt-detector-roberta
      - key: INFERENCE_DEVICE
        value: cpu
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codewithanil-postgres
          property: connectionString

databases:
  # Managed PostgreSQL database on Render
  - name: codewithanil-postgres
    plan: free
    region: oregon
    databaseName: codewithanil
    user: codewithanil_admin
